[nightlight]
enabled = true
temperature_night = 5500

[plugin_settings."blackbartblues/keymap"]
compositor = "niri"

[plugin_settings."nomadcxx/gamer-mode"]
profile = "heavy"

[plugins]
enabled = []

[shell]
font_family = "Google Sans Flex"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
settings_expand_all_groups = true
settings_window_translucent = true

    [shell.launcher]
    app_grid = true
    category_icons_only = true
    layout = "simple"

    [shell.panel]
    open_near_click_control_center = true
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/monofone/Pictures/Wallpapers/Zen/Distort/2.jpg"

    [wallpaper.last]
    path = "/home/monofone/Pictures/Wallpapers/Zen/Distort/2.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/monofone/Pictures/Wallpapers/Zen/Distort/2.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/monofone/Pictures/Wallpapers/Zen/Distort/2.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "vibrant"

[widget.audio_visualizer]
bands = 32
width = 220

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%a %d %b %H:%M}"

[widget.media]
hide_when_idle = true
hide_when_no_media = true
show_progress = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.spacer_2]
anchor = true
length = 6
type = "spacer"

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.weather]
show_condition = false
