[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.4999999888241291
    capsule = true
    capsule_border_width = 0.5
    center = [ "media", "clock", "spacer_2", "weather", "audio_visualizer" ]
    contact_shadow = true
    end = [ "tray", "notifications", "bluetooth", "network", "volume", "battery", "control-center", "session" ]
    font_family = "Google Sans Flex"
    font_scale = 0.9499999862164259
    font_weight = 400
    margin_ends = 0
    start = [ "launcher", "workspaces", "taskbar", "sysmon" ]

