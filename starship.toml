# version: 1.0.0
"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

add_newline = false

format = """$all\
$directory\
$character"""

right_format = """
$battery\
$time"""

[directory]
read_only = " 󰌾"
truncation_length = 2
use_os_path_sep = true

[time]
disabled = false
format = " $time"
time_format = "%R"
utc_time_offset = "local"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "󰁹"
charging_symbol = "[󰂄](bold green)"
discharging_symbol = "󰂃"
unknown_symbol = "󰂑"
empty_symbol = "󰂎"

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
discharging_symbol = "󰁹"
style = "dimmed yellow"

[[battery.display]]
threshold = 80
discharging_symbol = "󰁹"
style = "dimmed green"

